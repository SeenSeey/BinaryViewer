name: Windows

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-test-package:
    name: MSVC x64 / Qt 5.15.2
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v6.0.2

      # install-qt-action uses the pinned aqtinstall version below to download
      # Qt 5.15.2 binaries from Qt's official archive mirrors and cache them.
      - name: Install Qt 5.15.2
        uses: jurplel/install-qt-action@v4.3.1
        with:
          version: '5.15.2'
          host: windows
          target: desktop
          arch: win64_msvc2019_64
          cache: true
          cache-key-prefix: BinaryViewer-Qt-5.15.2-msvc2019-x64
          aqtversion: '==3.3.0'
          py7zrversion: '==1.1.0'

      - name: Configure
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath 'build/windows') {
            Remove-Item -LiteralPath 'build/windows' -Recurse -Force
          }
          cmake -S . -B build/windows `
            -G 'Visual Studio 17 2022' `
            -A x64 `
            -DBUILD_TESTING=ON `
            "-DCMAKE_PREFIX_PATH=$env:QT_ROOT_DIR"

      - name: Build Release
        run: cmake --build build/windows --config Release --parallel

      - name: Test Release
        run: ctest --test-dir build/windows -C Release --output-on-failure

      - name: Create portable package
        run: cmake --build build/windows --config Release --target package_windows

      - name: Upload portable ZIP
        uses: actions/upload-artifact@v7.0.1
        with:
          name: BinaryViewer-windows-x64
          path: build/windows/package/windows/BinaryViewer-*-windows-x64.zip
          if-no-files-found: error
          compression-level: 0
